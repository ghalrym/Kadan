server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Images and masks arrive as JSON data URLs. Keep streaming responses unbuffered.
    client_max_body_size 128m;

    location = /frontend-health {
        access_log off;
        return 200 'ok';
    }

    location ~ ^/(v1(?:/|$)|model-lifecycle(?:/|$)|health$|openapi\.json$|docs(?:/|$)) {
        # Resolve the current container address after an API replacement.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $hikari_api http://api:8000;
        proxy_pass $hikari_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
