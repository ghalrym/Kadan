# Additive, opt-in trial overlay. Review the matching core LFM3 PR first.
# docker compose -f compose.yaml -f compose.lfm3-vision.yaml --profile lfm3-vision ...
services:
  hikari-api:
    environment:
      HIKARI_ENABLE_LFM3_VISION: ${HIKARI_ENABLE_LFM3_VISION:-false}

  kadan-api:
    environment:
      KADAN_EXPERIMENTAL_LFM3_VISION: ${KADAN_EXPERIMENTAL_LFM3_VISION:-false}

  kadan-runner:
    environment:
      KADAN_EXPERIMENTAL_LFM3_VISION: ${KADAN_EXPERIMENTAL_LFM3_VISION:-false}

  hikari-worker-lfm3-vision:
    profiles: [lfm3-vision]
    build:
      context: ./services/hikari
      dockerfile: experimental_worker/Dockerfile
    init: true
    environment:
      HIKARI_API_URL: ${HIKARI_API_URL:-ws://hikari-api:8000/v1/workers}
      HIKARI_WORKER_TOKEN: ${HIKARI_WORKER_TOKEN:-insecure-api-key}
      HIKARI_EXPERIMENTAL_BACKEND: experimental_worker.vision
      HIKARI_ENABLE_LFM3_VISION: ${HIKARI_ENABLE_LFM3_VISION:-false}
      KADAN_MODEL_DIR: /var/lib/kadan/models
    volumes:
      - lfm3_vision_models:/var/lib/kadan/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      hikari-api:
        condition: service_healthy

volumes:
  lfm3_vision_models:
