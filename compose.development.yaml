services:
  migrate:
    image: kadan-dev:local

  api:
    image: kadan-dev:local
    command: [python, -m, uvicorn, api.server:app, --host, 0.0.0.0, --port, "8000", --reload, --reload-dir, /app/api]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./api:/app/api:ro

  frontend:
    build:
      target: development
    environment:
      WATCH_POLLING: "true"
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: [sh, -c, "npm ci && exec npm run dev -- --host 0.0.0.0 --port 8080 --strictPort"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
