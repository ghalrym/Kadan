services:
  hikari-migrate:
    image: kadan-dev:local

  hikari-api:
    image: kadan-hikari-dev:local
    build:
      target: development
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./services/hikari/api:/app/api:ro
      - ./services/hikari/bin:/app/bin:ro

  # Rebuilds only kadan-worker-llm from the source mount and restarts it.
  hikari-worker-llm:
    image: kadan-hikari-worker-llm-dev:local
    build:
      target: development
    command: [python, bin/hikari.py, dev, worker, llm]
    volumes:
      - ./services/hikari/bin:/app/bin:ro
      - ./services/hikari/inference_worker:/src/inference_worker:ro
      # Seeded from this image's build tree on first use; keeps rebuilds incremental.
      - hikari_worker_llm_build:/build

  # Rebuilds only kadan-worker-decision from the source mount and restarts it.
  hikari-worker-decision:
    image: kadan-hikari-worker-decision-dev:local
    build:
      target: development
    command: [python, bin/hikari.py, dev, worker, decision]
    volumes:
      - ./services/hikari/bin:/app/bin:ro
      - ./services/hikari/inference_worker:/src/inference_worker:ro
      # Seeded from this image's build tree on first use; keeps rebuilds incremental.
      - hikari_worker_decision_build:/build

  # Rebuilds only kadan-worker-tts from the source mount and restarts it.
  hikari-worker-tts:
    image: kadan-hikari-worker-tts-dev:local
    build:
      target: development
    command: [python, bin/hikari.py, dev, worker, tts]
    volumes:
      - ./services/hikari/bin:/app/bin:ro
      - ./services/hikari/inference_worker:/src/inference_worker:ro
      # Seeded from this image's build tree on first use; keeps rebuilds incremental.
      - hikari_worker_tts_build:/build

  # Rebuilds only kadan-worker-speech from the source mount and restarts it.
  hikari-worker-speech:
    image: kadan-hikari-worker-speech-dev:local
    build:
      target: development
    command: [python, bin/hikari.py, dev, worker, speech]
    volumes:
      - ./services/hikari/bin:/app/bin:ro
      - ./services/hikari/inference_worker:/src/inference_worker:ro
      # Seeded from this image's build tree on first use; keeps rebuilds incremental.
      - hikari_worker_speech_build:/build

  # Rebuilds only kadan-worker-formatting from the source mount and restarts it.
  hikari-worker-formatting:
    image: kadan-hikari-worker-formatting-dev:local
    build:
      target: development
    command: [python, bin/hikari.py, dev, worker, formatting]
    volumes:
      - ./services/hikari/bin:/app/bin:ro
      - ./services/hikari/inference_worker:/src/inference_worker:ro
      # Seeded from this image's build tree on first use; keeps rebuilds incremental.
      - hikari_worker_formatting_build:/build

  # Rebuilds only kadan-worker-image from the source mount and restarts it.
  hikari-worker-image:
    image: kadan-hikari-worker-image-dev:local
    build:
      target: development
    command: [python, bin/hikari.py, dev, worker, image]
    volumes:
      - ./services/hikari/bin:/app/bin:ro
      - ./services/hikari/inference_worker:/src/inference_worker:ro
      # Seeded from this image's build tree on first use; keeps rebuilds incremental.
      - hikari_worker_image_build:/build

  # Rebuilds only kadan-worker-video from the source mount and restarts it.
  hikari-worker-video:
    image: kadan-hikari-worker-video-dev:local
    build:
      target: development
    command: [python, bin/hikari.py, dev, worker, video]
    volumes:
      - ./services/hikari/bin:/app/bin:ro
      - ./services/hikari/inference_worker:/src/inference_worker:ro
      # Seeded from this image's build tree on first use; keeps rebuilds incremental.
      - hikari_worker_video_build:/build


  hikari-frontend:
    build:
      target: development
    environment:
      WATCH_POLLING: "true"
      API_PROXY_TARGET: http://hikari-api:8000
    volumes:
      - ./services/hikari/frontend:/app
      - frontend_node_modules:/app/node_modules
    command: [sh, -c, "npm ci && exec npm run dev -- --host 0.0.0.0 --port 8080 --strictPort"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  tsuchi-api:
    # Without watchfiles, uvicorn's StatReload polls bind-mounted *.py files.
    command: [uvicorn, tsuchi.main:app, --host, 0.0.0.0, --port, "8000", --no-proxy-headers, --reload, --reload-dir, /app/tsuchi]
    volumes:
      - ./services/tsuchi/tsuchi:/app/tsuchi:ro

  kadan-api:
    command: [uvicorn, kadan.api.server:app, --host, kadan-api-internal, --port, "8630", --reload, --reload-dir, /app/kadan]
    volumes:
      - ./services/kadan/kadan:/app/kadan:ro

  # Watchfiles owns the runner process directly; the development entry point
  # retries crashes without leaving a shell's child behind during reload.
  kadan-runner:
    command:
      - watchfiles
      - --filter
      - python
      - kadan.runner.__main__.run_development
      - /app/kadan
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./services/kadan/kadan:/app/kadan:ro

  tsuchi-frontend:
    build:
      target: development
    environment:
      WATCH_POLLING: "true"
      API_PROXY_TARGET: http://tsuchi-api:8000
    volumes:
      - ./services/tsuchi/web:/app
      - tsuchi_frontend_node_modules:/app/node_modules
    command: [sh, -c, "npm ci --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 8080 --strictPort"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  kadan-frontend:
    build:
      target: development
    environment:
      WATCH_POLLING: "true"
      API_PROXY_TARGET: http://kadan-api:8630
    volumes:
      - ./services/kadan/web:/app
      - kadan_frontend_node_modules:/app/node_modules
    command: [sh, -c, "npm ci --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 8080 --strictPort"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  tsuchi_frontend_node_modules:
  kadan_frontend_node_modules:
  hikari_worker_llm_build:
  hikari_worker_decision_build:
  hikari_worker_tts_build:
  hikari_worker_speech_build:
  hikari_worker_formatting_build:
  hikari_worker_image_build:
  hikari_worker_video_build:
