name: Publish draft PR as Ai Kadan

on:
  workflow_dispatch:
    inputs:
      head:
        description: Existing codex/name branch (approved bot migration aliases infer their stacked base)
        required: true
        type: string
      expected_sha:
        description: Full 40-character lowercase commit SHA of that branch
        required: true
        type: string
      title:
        description: Draft PR title
        required: true
        type: string
      body:
        description: Draft PR description
        required: true
        type: string

permissions:
  contents: read

# One publisher at a time, including any environment protection wait.
# GitHub may replace older pending runs; it never cancels the running publisher.
concurrency:
  group: ai-kadan-draft-pr-publisher
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'ghalrym/Kadan' &&
      github.repository_id == '1403845248' &&
      github.ref == 'refs/heads/master' &&
      github.actor == 'ghalrym' &&
      github.actor_id == '177494187' &&
      github.triggering_actor == 'ghalrym'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate inputs and existing environment without accessing secrets
        run: python3 .github/scripts/publish_pr.py preflight

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: kadan-pr-publishing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck owner and environment before minting token
        run: python3 .github/scripts/publish_pr.py preflight
      - name: Mint repository-scoped token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: Iv23liGu3LqUPYzPqdag
          private-key: ${{ secrets.AI_KADAN_APP_PRIVATE_KEY }}
          owner: ghalrym
          repositories: Kadan
          permission-contents: read
          permission-pull-requests: write
          skip-token-revoke: false
      - name: Publish or report existing PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: python3 .github/scripts/publish_pr.py publish
