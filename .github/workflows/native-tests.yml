name: Native unit tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-units-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: C++ unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install tooling dependencies
        run: python3 -m pip install -r bin/requirements.txt
      - name: Run native unit checks
        run: python3 bin/kadan.py check native --build-dir /tmp/kadan-native --sanitize
