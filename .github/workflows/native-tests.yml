name: Native worker CPU tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install optional CPU decision dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev libicu-dev libpcre2-dev nlohmann-json3-dev
      - name: Configure CPU-only C++20 worker
        run: cmake -S native -B /tmp/kadan-native -DCMAKE_BUILD_TYPE=Debug -DKADAN_ENABLE_CUDA=OFF -DKADAN_ENABLE_DECISIONS=ON -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
      - name: Build with bounded parallelism
        run: cmake --build /tmp/kadan-native --parallel 2
      - name: Test native accounting, formats and bounded checkpoint reads
        run: ctest --test-dir /tmp/kadan-native --output-on-failure -LE full-graph

  h3-denoiser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Configure complete CPU H3 denoiser
        run: cmake -S native -B /tmp/kadan-h3-denoiser -DCMAKE_BUILD_TYPE=Release -DKADAN_ENABLE_CUDA=OFF -DKADAN_ENABLE_DECISIONS=OFF
      - name: Build only denoiser and lifecycle test
        run: cmake --build /tmp/kadan-h3-denoiser --target kadan-h3-denoise h3-denoiser-tests --parallel 2
      - name: Validate all 50 blocks, Turbo and resource cleanup
        run: ctest --test-dir /tmp/kadan-h3-denoiser --output-on-failure -R '^h3-denoiser$'
