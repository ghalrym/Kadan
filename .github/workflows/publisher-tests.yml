name: Publisher tests

on:
  push:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/publish-draft-pr.yml'
      - '.github/workflows/publisher-tests.yml'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/publish-draft-pr.yml'
      - '.github/workflows/publisher-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
