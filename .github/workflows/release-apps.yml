name: Release Kadan Apps

on:
  push:
    tags:
      - "v*"
  schedule:
    # Run every 3 days at 06:00 UTC; skips automatically if no new commits since last release tag.
    - cron: "0 6 */3 * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (leave blank for automatic date version)"
        required: false
        default: ""
      force:
        description: "Build and release even if no new commits exist since the last tag"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  prepare-release:
    name: Check for new commits
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
      release_version: ${{ steps.check.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: check
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "release_version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "Tag push detected: ${TAG}"
            exit 0
          fi

          LAST_TAG="$(git tag --list 'v*' --sort=-creatordate | head -n 1 || true)"
          if [[ -n "${LAST_TAG}" ]]; then
            NEW_COMMITS="$(git rev-list --count "${LAST_TAG}..HEAD")"
          else
            NEW_COMMITS="$(git rev-list --count HEAD)"
          fi
          echo "Last release tag: ${LAST_TAG:-none} (new commits: ${NEW_COMMITS})"

          FORCE="${{ inputs.force || false }}"
          if [[ "${NEW_COMMITS}" -eq 0 && "${FORCE}" != "true" ]]; then
            echo "No new commits since ${LAST_TAG}; skipping scheduled release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          INPUT_VER="${{ inputs.version }}"
          if [[ -n "${INPUT_VER}" ]]; then
            VER="${INPUT_VER#v}"
            TAG="v${VER}"
          else
            BASE="0.1.$(date -u +%Y%m%d)"
            VER="${BASE}"
            TAG="v${VER}"
            SUFFIX=2
            while git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; do
              VER="${BASE}-${SUFFIX}"
              TAG="v${VER}"
              SUFFIX=$((SUFFIX + 1))
            done
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Preparing release ${TAG} (${NEW_COMMITS} new commits)."

  kadan-desktop:
    name: Kadan Desktop (${{ matrix.os }})
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build unified Kadan frontend
        working-directory: services/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Run Kadan Desktop Rust tests
        working-directory: apps/kadan-desktop/src-tauri
        run: cargo test

      - name: Bundle Kadan Desktop installer
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/kadan-desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Kadan Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kadan-desktop-${{ matrix.platform }}
          path: |
            apps/kadan-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/kadan-desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/kadan-desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/kadan-desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/kadan-desktop/src-tauri/target/release/bundle/dmg/*.dmg

  kadan-server:
    name: Kadan Server (${{ matrix.os }})
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ pkg-config \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libcurl4-openssl-dev libssl-dev libarchive-dev libpng-dev zlib1g-dev \
            libicu-dev libpcre2-dev libopenblas-dev nlohmann-json3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Build unified C++ kadan-worker (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake -S services/hikari/inference_worker -B build-worker -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DKADAN_ENABLE_CUDA=OFF
          cmake --build build-worker --target kadan-worker
          cmake --install build-worker --component kadan-worker --prefix build-worker-install

      - name: Stage Kadan Server runtime (Linux)
        if: matrix.platform == 'linux'
        run: |
          bash scripts/bundle-kadan-server.sh "${PWD}/build-worker-install"

      - name: Stage Kadan Server runtime (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          .\scripts\bundle-kadan-server.ps1

      - name: Build Kadan Server UI
        working-directory: apps/kadan-server
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Run Kadan Server Rust tests
        working-directory: apps/kadan-server/src-tauri
        run: cargo test

      - name: Enable runtime resources in tauri.conf.json for bundle
        shell: python
        run: |
          import json
          p = "apps/kadan-server/src-tauri/tauri.conf.json"
          cfg = json.load(open(p))
          cfg["bundle"]["resources"] = {"resources/runtime": "runtime"}
          json.dump(cfg, open(p, "w"), indent=2)

      - name: Bundle Kadan Server installer
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/kadan-server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Kadan Server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kadan-server-${{ matrix.platform }}
          path: |
            apps/kadan-server/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/kadan-server/src-tauri/target/release/bundle/deb/*.deb
            apps/kadan-server/src-tauri/target/release/bundle/nsis/*.exe
            apps/kadan-server/src-tauri/target/release/bundle/msi/*.msi

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, kadan-desktop, kadan-server]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Kadan ${{ needs.prepare-release.outputs.tag }}
          files: release-artifacts/*
          generate_release_notes: true
