name: Release Kadan Apps

on:
  push:
    tags:
      - "v*"
  schedule:
    # Run every 3 days at 06:00 UTC; skips automatically if no new commits since last release tag.
    - cron: "0 6 */3 * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (leave blank for automatic date version)"
        required: false
        default: ""
      force:
        description: "Build and release even if no new commits exist since the last tag"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  prepare-release:
    name: Check for new commits
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
      release_version: ${{ steps.check.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: check
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "release_version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "Tag push detected: ${TAG}"
            exit 0
          fi

          LAST_TAG="$(git tag --list 'v*' --sort=-creatordate | head -n 1 || true)"
          if [[ -n "${LAST_TAG}" ]]; then
            NEW_COMMITS="$(git rev-list --count "${LAST_TAG}..HEAD")"
          else
            NEW_COMMITS="$(git rev-list --count HEAD)"
          fi
          echo "Last release tag: ${LAST_TAG:-none} (new commits: ${NEW_COMMITS})"

          FORCE="${{ inputs.force || false }}"
          if [[ "${NEW_COMMITS}" -eq 0 && "${FORCE}" != "true" ]]; then
            echo "No new commits since ${LAST_TAG}; skipping scheduled release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          INPUT_VER="${{ inputs.version }}"
          if [[ -n "${INPUT_VER}" ]]; then
            VER="${INPUT_VER#v}"
            TAG="v${VER}"
          else
            BASE="0.1.$(date -u +%Y%m%d)"
            VER="${BASE}"
            TAG="v${VER}"
            SUFFIX=2
            while git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; do
              VER="${BASE}-${SUFFIX}"
              TAG="v${VER}"
              SUFFIX=$((SUFFIX + 1))
            done
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Preparing release ${TAG} (${NEW_COMMITS} new commits)."

  kadan:
    name: Kadan (${{ matrix.os }})
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ pkg-config \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libcurl4-openssl-dev libssl-dev libarchive-dev libpng-dev zlib1g-dev \
            libicu-dev libpcre2-dev libopenblas-dev nlohmann-json3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the web app
        working-directory: services/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Kadan bundles everything it needs to run its services on this computer.
      - name: Build unified C++ kadan-worker (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake -S services/hikari/inference_worker -B build-worker -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DKADAN_ENABLE_CUDA=OFF
          cmake --build build-worker --target kadan-worker
          cmake --install build-worker --component kadan-worker --prefix build-worker-install

      - name: Stage Kadan runtime (Linux)
        if: matrix.platform == 'linux'
        run: |
          bash scripts/bundle-kadan-runtime.sh "${PWD}/build-worker-install"

      - name: Stage Kadan runtime (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          .\scripts\bundle-kadan-runtime.ps1

      - name: Stamp release version and bundle the runtime
        shell: python
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
        run: |
          import json, os, re
          ver = os.environ["RELEASE_VERSION"]
          conf_path = "apps/kadan/src-tauri/tauri.conf.json"
          cfg = json.load(open(conf_path))
          cfg["version"] = ver
          if os.path.isdir("apps/kadan/src-tauri/resources/runtime"):
              cfg["bundle"]["resources"]["resources/runtime"] = "runtime"
          json.dump(cfg, open(conf_path, "w"), indent=2)
          cargo_path = "apps/kadan/src-tauri/Cargo.toml"
          txt = open(cargo_path).read()
          txt = re.sub(r'(?m)^version\s*=\s*"[^"]+"', f'version = "{ver}"', txt, count=1)
          open(cargo_path, "w").write(txt)

      - name: Run Kadan Rust tests
        working-directory: apps/kadan/src-tauri
        run: cargo test

      - name: Bundle Kadan installer
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/kadan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive macOS Kadan app bundle for in-place updates
        if: matrix.platform == 'macos'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          MACOS_DIR="apps/kadan/src-tauri/target/release/bundle/macos"
          if [[ -d "${MACOS_DIR}/Kadan.app" ]]; then
            tar -czf "${MACOS_DIR}/Kadan_${RELEASE_VERSION}_${ARCH}.app.tar.gz" -C "${MACOS_DIR}" "Kadan.app"
          fi

      - name: Upload Kadan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kadan-${{ matrix.platform }}
          path: |
            apps/kadan/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/kadan/src-tauri/target/release/bundle/deb/*.deb
            apps/kadan/src-tauri/target/release/bundle/nsis/*.exe
            apps/kadan/src-tauri/target/release/bundle/msi/*.msi
            apps/kadan/src-tauri/target/release/bundle/dmg/*.dmg
            apps/kadan/src-tauri/target/release/bundle/macos/*.app.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, kadan]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate release manifest with SHA-256 checksums
        shell: python
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          import datetime, hashlib, json, os, pathlib

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          version = os.environ["RELEASE_VERSION"]
          root = pathlib.Path("release-artifacts")

          def classify(name: str):
              low = name.lower()
              app = "kadan"
              if low.endswith(".appimage"):
                  arch = "aarch64" if ("aarch64" in low or "arm64" in low) else "x86_64"
                  return app, f"linux-{arch}-appimage"
              if low.endswith(".deb"):
                  arch = "aarch64" if ("aarch64" in low or "arm64" in low) else "x86_64"
                  return app, f"linux-{arch}-deb"
              if low.endswith(".exe"):
                  arch = "aarch64" if ("aarch64" in low or "arm64" in low) else "x86_64"
                  return app, f"windows-{arch}-nsis"
              if low.endswith(".msi"):
                  arch = "aarch64" if ("aarch64" in low or "arm64" in low) else "x86_64"
                  return app, f"windows-{arch}-msi"
              if low.endswith(".app.tar.gz"):
                  arch = "aarch64" if ("aarch64" in low or "arm64" in low) else "x86_64"
                  return app, f"macos-{arch}-app"
              if low.endswith(".dmg"):
                  arch = "aarch64" if ("aarch64" in low or "arm64" in low) else "x86_64"
                  return app, f"macos-{arch}-dmg"
              return None, None

          apps = {"kadan": {}}
          for path in sorted(root.iterdir()):
              if not path.is_file() or path.name == "release-manifest.json":
                  continue
              app, key = classify(path.name)
              if not app or not key:
                  continue
              h = hashlib.sha256()
              with path.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              apps[app][key] = {
                  "filename": path.name,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{path.name}",
                  "sha256": h.hexdigest(),
                  "size": path.stat().st_size,
              }

          manifest = {
              "version": version,
              "tag": tag,
              "published_at": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              "release_url": f"https://github.com/{repo}/releases/tag/{tag}",
              "apps": apps,
          }
          (root / "release-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Kadan ${{ needs.prepare-release.outputs.tag }}
          files: release-artifacts/*
          generate_release_notes: true
