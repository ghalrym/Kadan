name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and OpenAPI schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      KADAN_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - name: Install Kadan with CPU wheels for numerical tests
        run: |
          python -m pip install torch==2.14.1 torchaudio==2.11.0 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r api/requirements.txt
          python -m pip check
          python -m api.inference.check_install
      - name: Run backend tests
        run: python -m unittest discover -s api/tests -v
      - name: Verify review-only denoiser harness contracts
        run: python -m unittest discover -s docs/real-weight-denoiser -p 'test_*.py' -v
      - name: Verify the pinned H3 output sanitizer
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/sgl-project/sglang/f048d5aa4bc1bcad7fa2c60d067590d83d6dbe4a/python/sglang/multimodal_gen/configs/sample/sampling_params.py -o "$RUNNER_TEMP/kadan-h3-sampling.py"
          KADAN_H3_SAMPLING_SOURCE="$RUNNER_TEMP/kadan-h3-sampling.py" python -m unittest api.tests.inference.video.test_h3_upstream -v

  container:
    name: API container inference imports
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the default CUDA-enabled API image
        run: docker build -t kadan-api:test api
      - name: Verify installed native runtime and API startup imports
        run: |
          docker run --rm kadan-api:test python -m api.inference.check_install
          docker run --rm kadan-api:test python -c 'import torch; assert torch.version.cuda == "13.0", torch.__version__'
          docker run --rm kadan-api:test python -c 'from api.server import app; assert app'
          docker compose config --quiet

  generated-client:
    name: Generated frontend API client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Regenerate frontend API client
        run: npm --prefix frontend run generate:api
      - name: Check generated client matches committed files
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- frontend/src/api/generated)" ]]; then
            git diff -- frontend/src/api/generated
            git status --short --untracked-files=all -- frontend/src/api/generated
            echo "::error::Generated API client is stale. Run npm --prefix frontend run generate:api and commit the generated files."
            exit 1
          fi
      - name: Test frontend chat API integration
        run: npm --prefix frontend test
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Build frontend
        run: npm --prefix frontend run build
