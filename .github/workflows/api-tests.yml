name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and OpenAPI schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s api/tests -v

  generated-client:
    name: Generated frontend API client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Regenerate frontend API client
        run: npm --prefix frontend run generate:api
      - name: Check generated client matches committed files
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- frontend/src/api/generated)" ]]; then
            git diff -- frontend/src/api/generated
            git status --short --untracked-files=all -- frontend/src/api/generated
            echo "::error::Generated API client is stale. Run npm --prefix frontend run generate:api and commit the generated files."
            exit 1
          fi
      - name: Test frontend chat API integration
        run: npm --prefix frontend test
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Build frontend
        run: npm --prefix frontend run build
