name: Inference worker unit tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inference-worker-units-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inference-worker:
    name: C++ unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install worker preparation headers
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev libcurl4-openssl-dev libssl-dev libarchive-dev libpng-dev
      - name: Install tooling dependencies
        run: python3 -m pip install -r bin/requirements.txt
      - name: Run inference worker unit checks
        run: python3 bin/kadan.py check inference-worker --build-dir /tmp/kadan-inference-worker --sanitize
  cpp-format:
    name: C++ format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned LLVM tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check C++ formatting
        run: python bin/kadan.py check cpp-format
  cpp-lint:
    name: C++ lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install inference worker component headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nlohmann-json3-dev libicu-dev libopenblas-dev libpcre2-dev libcurl4-openssl-dev libssl-dev libarchive-dev libpng-dev
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned LLVM tools
        run: python -m pip install -r requirements-dev.txt
      - name: Run clang-tidy
        run: python bin/kadan.py check cpp-lint --build-dir /tmp/kadan-lint
      - name: Run tokenizer metadata unit tests
        run: |
          cmake --build /tmp/kadan-lint --target text-tokenizer-tests --parallel 2
          ctest --test-dir /tmp/kadan-lint -R '^text-tokenizer$' --output-on-failure
