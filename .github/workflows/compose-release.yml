# Publishes immutable images and a release artifact only; never accesses a server.
# Host enrollment, disposable verification and dispatcher startup remain separate gates.
name: Compose release
on:
  push:
    branches: [master]
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: compose-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      HIKARI_WORKER_TOKEN: build-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/hikari/bin/requirements.txt
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify reviewed passing master, build and push versioned images
        env:
          RELEASE_SOURCE: ${{ github.sha }}
        run: |
          mkdir "$RUNNER_TEMP/kadan-release"
          PYTHONPATH=services/hikari python - <<'PY'
          import os
          from pathlib import Path
          from bin.release import build_release
          build_release(os.environ['RELEASE_SOURCE'], Path(os.environ['RUNNER_TEMP']) / 'kadan-release/release.json')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: compose-release
          path: ${{ runner.temp }}/kadan-release/release.json
          if-no-files-found: error
          retention-days: 90
# An independently enrolled host can consume successful runs. No host access,
# registry visibility changes or persistent credentials are configured here.
