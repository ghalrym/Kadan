name: Compose release build fit

on:
  pull_request:
    paths:
      - .github/workflows/compose-build-fit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-build-fit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-release:
    name: Complete release image build fit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HIKARI_WORKER_TOKEN: build-fit-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/hikari/bin/requirements.txt
      - name: Record available builder capacity
        run: |
          df -h /
          free -h
          docker version
          docker compose version
      - name: Build the complete initial release without pushing or running it
        run: |
          PYTHONPATH=services/hikari python - <<'PY'
          import os
          import subprocess
          from bin.rollout import SERVICES
          # Match the initial publisher's ordering and shared runner/API image.
          # Local image exports are conservative: publication exports to GHCR.
          for service in sorted(set(SERVICES) - {'kadan-runner'}):
              print(f'Building {service}', flush=True)
              subprocess.run(
                  ['docker', 'compose', '--env-file', '/dev/null', 'build', service],
                  check=True,
                  env={
                      **{key: value for key, value in os.environ.items()
                         if key in {'PATH', 'HOME', 'DOCKER_CONFIG'}},
                      'HIKARI_WORKER_TOKEN': 'build-placeholder-not-a-secret',
                  },
              )
          PY
      - name: Record final disk and image footprint
        if: always()
        run: |
          df -h /
          docker system df
