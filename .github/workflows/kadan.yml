name: Kadan
on:
  push:
    paths:
      - 'services/kadan/**'
      - 'services/tracing/**'
      - '.github/workflows/kadan.yml'
  pull_request:
    paths:
      - 'services/kadan/**'
      - 'services/tracing/**'
      - '.github/workflows/kadan.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kadan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: API unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/kadan
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/kadan/requirements*.txt
      - run: python -m pip install ../tracing
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  web:
    name: Web unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/kadan
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/kadan/web/package-lock.json
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
