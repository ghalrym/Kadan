name: Hikari
on:
  push:
    paths:
      - 'services/hikari/**'
      - 'services/tracing/**'
      - '.github/workflows/hikari.yml'
  pull_request:
    paths:
      - 'services/hikari/**'
      - 'services/tracing/**'
      - '.github/workflows/hikari.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hikari-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: API unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/hikari/api/requirements*.txt
      - name: Install unit-test dependencies
        run: |
          python -m pip install services/tracing
          python -m pip install -r services/hikari/api/requirements.txt -r services/hikari/bin/requirements.txt
      - name: Run isolated unit tests
        run: |
          python services/hikari/bin/hikari.py check api
  frontend:
    name: Frontend lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/hikari/frontend/package-lock.json
      - run: npm ci --prefix services/hikari/frontend --prefer-offline --no-audit
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r services/hikari/bin/requirements.txt
      - run: python3 services/hikari/bin/hikari.py check frontend-lint
      - run: python3 services/hikari/bin/hikari.py check frontend-unit
  inference-worker:
    name: C++ unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install worker preparation headers
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev libcurl4-openssl-dev libssl-dev libarchive-dev libpng-dev
      - name: Install tooling dependencies
        run: python3 -m pip install -r services/hikari/bin/requirements.txt
      - name: Run inference worker unit checks
        run: python3 services/hikari/bin/hikari.py check inference-worker --build-dir /tmp/kadan-inference-worker --sanitize
  cpp-format:
    name: C++ format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/hikari/requirements-dev.txt
      - name: Install pinned LLVM tools
        run: python -m pip install -r services/hikari/requirements-dev.txt
      - name: Check C++ formatting
        run: python services/hikari/bin/hikari.py check cpp-format
  cpp-lint:
    name: C++ lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install inference worker component headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nlohmann-json3-dev libicu-dev libopenblas-dev libpcre2-dev libcurl4-openssl-dev libssl-dev libarchive-dev libpng-dev
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/hikari/requirements-dev.txt
      - name: Install pinned LLVM tools
        run: python -m pip install -r services/hikari/requirements-dev.txt
      - name: Run clang-tidy
        run: python services/hikari/bin/hikari.py check cpp-lint --build-dir /tmp/kadan-lint
      - name: Run tokenizer and H3 inventory unit tests
        run: |
          cmake --build /tmp/kadan-lint --target text-tokenizer-tests h3-inventory-tests --parallel 2
          ctest --test-dir /tmp/kadan-lint -R '^(text-tokenizer|h3-inventory)$' --output-on-failure
