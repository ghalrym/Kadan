name: Python format
on:
  push:
    paths:
      - '**/*.py'
      - 'ruff.toml'
      - 'services/hikari/requirements-dev.txt'
      - 'services/hikari/bin/requirements.txt'
      - '.github/workflows/python-format.yml'
  pull_request:
    paths:
      - '**/*.py'
      - 'ruff.toml'
      - 'services/hikari/requirements-dev.txt'
      - 'services/hikari/bin/requirements.txt'
      - '.github/workflows/python-format.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-format-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-format:
    name: Ruff format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: services/hikari/requirements-dev.txt
      - run: python -m pip install --upgrade "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - name: Install formatter
        run: python -m pip install -r services/hikari/requirements-dev.txt
      - name: Check Python formatting
        run: python services/hikari/bin/hikari.py check format
