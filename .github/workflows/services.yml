name: Agent and storage services
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: services-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: ${{ matrix.service }} unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - service: kadan
            python: '3.12'
          - service: tsuchi
            python: '3.14'
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  web:
    name: ${{ matrix.service }} web build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        service: [kadan, tsuchi]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/web/package-lock.json
      - run: npm ci --prefix web
      - if: matrix.service == 'kadan'
        run: npm test --prefix web
      - run: npm run build --prefix web

  images:
    name: ${{ matrix.service }} Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        service: [kadan-api, kadan-frontend, tsuchi-api, tsuchi-frontend, hikari-frontend]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build ${{ matrix.service }}

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.development.yaml config --quiet
