name: Agent and storage services
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Compose requires service keys when parsing the file. CI only builds and
# validates configuration; these placeholders are not secrets and never serve.
env:
  HIKARI_WORKER_TOKEN: ci-placeholder-not-a-secret
  KADAN_SANDBOX_API_KEY: ci-placeholder-not-a-secret
concurrency:
  group: services-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: ${{ matrix.service }} unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - service: kadan
            python: '3.12'
          - service: tsuchi
            python: '3.14'
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: python -m pip install ../tracing
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m pytest ../tracing/tests -q

  web:
    name: ${{ matrix.service }} web build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        service: [kadan, tsuchi]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/web/package-lock.json
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile tracing config --quiet
      - run: docker compose -f compose.yaml -f compose.development.yaml --profile tracing config --quiet
      - run: docker compose -f compose.yaml -f compose.runners.yaml config --quiet
      - run: KADAN_RUNNER_CAPACITY=8 docker compose -f compose.yaml -f compose.runners.yaml config --quiet
      - name: Validate Jaeger configuration without starting a collector
        run: docker compose run --rm --no-deps -T jaeger validate --config /etc/jaeger/config.yaml
