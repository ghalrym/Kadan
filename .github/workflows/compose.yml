name: Compose configuration
on:
  push:
    paths:
      - 'compose.yaml'
      - '.env.example'
      - 'infrastructure/jaeger/**'
      - '.github/workflows/compose.yml'
  pull_request:
    paths:
      - 'compose.yaml'
      - '.env.example'
      - 'infrastructure/jaeger/**'
      - '.github/workflows/compose.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Compose needs these placeholders to parse the configuration.
env:
  HIKARI_WORKER_TOKEN: ci-placeholder-not-a-secret
  KADAN_SANDBOX_API_KEY: ci-placeholder-not-a-secret
jobs:
  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile tracing config --quiet
      - run: docker compose --profile runners config --quiet
      - run: KADAN_RUNNER_CAPACITY=8 docker compose --profile runners config --quiet
      - name: Validate Jaeger configuration without starting a collector
        run: docker compose run --rm --no-deps -T jaeger validate --config /etc/jaeger/config.yaml
