name: Tracing unit tests
on:
  push:
    paths:
      - 'services/tracing/**'
      - '.github/workflows/tracing.yml'
  pull_request:
    paths:
      - 'services/tracing/**'
      - '.github/workflows/tracing.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tracing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Tracing unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: services/tracing/pyproject.toml
      - run: python -m pip install --upgrade "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: python -m pip install ./services/tracing 'pytest>=9,<10'
      - run: python -m pytest services/tracing/tests -q
