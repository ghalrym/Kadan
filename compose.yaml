# Preserve existing volume and container identity across checkout/repository renames.
name: kadan

services:
  jaeger:
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    profiles: [tracing]
    command: [--config, /etc/jaeger/config.yaml]
    volumes:
      - ./infrastructure/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    # OTLP stays on the existing Compose network; only the local UI is published.
    ports:
      - "127.0.0.1:16686:16686"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    environment:
      GOMEMLIMIT: 400MiB
      GOMAXPROCS: "1"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  hikari-postgres:
    image: postgres:18
    environment: &postgres_environment
      POSTGRES_DB: ${POSTGRES_DB:-kadan}
      POSTGRES_USER: ${POSTGRES_USER:-kadan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kadan}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  hikari-migrate:
    build:
      additional_contexts:
        tracing: ./services/tracing
      context: ./services/hikari
      dockerfile: api/Dockerfile
    environment: &database_environment
      <<: *postgres_environment
      POSTGRES_HOST: hikari-postgres
      POSTGRES_PORT: "5432"
    command: ["alembic", "-c", "api/alembic.ini", "upgrade", "head"]
    depends_on:
      hikari-postgres:
        condition: service_healthy
    restart: "no"

  # The API coordinates every worker's memory; it runs no inference itself.
  hikari-api:
    stop_grace_period: 5m
    build:
      additional_contexts:
        tracing: ./services/tracing
      context: ./services/hikari
      dockerfile: api/Dockerfile
    init: true
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      KADAN_TRACE_SAMPLE_RATIO: ${KADAN_TRACE_SAMPLE_RATIO:-0.1}
      <<: *database_environment
      # Every worker container authenticates with this token.
      HIKARI_WORKER_TOKEN: ${HIKARI_WORKER_TOKEN:?Set HIKARI_WORKER_TOKEN in .env; see .env.example}
    depends_on:
      hikari-postgres:
        condition: service_healthy
      hikari-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Language worker: the tier's mixture-of-experts model for chat.
  hikari-worker-llm:
    build:
      context: ./services/hikari
      dockerfile: inference_worker/workers/llm/Dockerfile
    command: [/opt/kadan/bin/kadan-worker-llm]
    init: true
    restart: unless-stopped
    environment:
      HIKARI_API_URL: ws://hikari-api:8000/v1/workers
      HIKARI_WORKER_TOKEN: ${HIKARI_WORKER_TOKEN:?Set HIKARI_WORKER_TOKEN in .env; see .env.example}
      KADAN_MODEL_DIR: /var/lib/kadan/models
    volumes:
      - model_data:/var/lib/kadan/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      hikari-api:
        condition: service_healthy

  # Decisions worker: Laya on the CPU.
  hikari-worker-decision:
    build:
      context: ./services/hikari
      dockerfile: inference_worker/workers/decision/Dockerfile
    command: [/opt/kadan/bin/kadan-worker-decision]
    init: true
    restart: unless-stopped
    environment:
      HIKARI_API_URL: ws://hikari-api:8000/v1/workers
      HIKARI_WORKER_TOKEN: ${HIKARI_WORKER_TOKEN:?Set HIKARI_WORKER_TOKEN in .env; see .env.example}
      KADAN_MODEL_DIR: /var/lib/kadan/models
    volumes:
      - model_data:/var/lib/kadan/models
    # CPU only: no GPU reservation.
    depends_on:
      hikari-api:
        condition: service_healthy

  # Speech synthesis worker.
  hikari-worker-tts:
    build:
      context: ./services/hikari
      dockerfile: inference_worker/workers/tts/Dockerfile
    command: [/opt/kadan/bin/kadan-worker-tts]
    init: true
    restart: unless-stopped
    environment:
      HIKARI_API_URL: ws://hikari-api:8000/v1/workers
      HIKARI_WORKER_TOKEN: ${HIKARI_WORKER_TOKEN:?Set HIKARI_WORKER_TOKEN in .env; see .env.example}
      KADAN_MODEL_DIR: /var/lib/kadan/models
    volumes:
      - model_data:/var/lib/kadan/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      hikari-api:
        condition: service_healthy

  # Transcription worker: native Whisper.
  hikari-worker-speech:
    build:
      context: ./services/hikari
      dockerfile: inference_worker/workers/speech/Dockerfile
    command: [/opt/kadan/bin/kadan-worker-speech]
    init: true
    restart: unless-stopped
    environment:
      HIKARI_API_URL: ws://hikari-api:8000/v1/workers
      HIKARI_WORKER_TOKEN: ${HIKARI_WORKER_TOKEN:?Set HIKARI_WORKER_TOKEN in .env; see .env.example}
      KADAN_MODEL_DIR: /var/lib/kadan/models
    volumes:
      - model_data:/var/lib/kadan/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      hikari-api:
        condition: service_healthy

  # Transcript formatting worker: S1-mini on the CPU.
  hikari-worker-formatting:
    build:
      context: ./services/hikari
      dockerfile: inference_worker/workers/formatting/Dockerfile
    command: [/opt/kadan/bin/kadan-worker-formatting]
    init: true
    restart: unless-stopped
    environment:
      HIKARI_API_URL: ws://hikari-api:8000/v1/workers
      HIKARI_WORKER_TOKEN: ${HIKARI_WORKER_TOKEN:?Set HIKARI_WORKER_TOKEN in .env; see .env.example}
      KADAN_MODEL_DIR: /var/lib/kadan/models
    volumes:
      - model_data:/var/lib/kadan/models
    # CPU only: no GPU reservation.
    depends_on:
      hikari-api:
        condition: service_healthy

  # Image worker: Qwen Image.
  hikari-worker-image:
    build:
      context: ./services/hikari
      dockerfile: inference_worker/workers/image/Dockerfile
    command: [/opt/kadan/bin/kadan-worker-image]
    init: true
    restart: unless-stopped
    environment:
      HIKARI_API_URL: ws://hikari-api:8000/v1/workers
      HIKARI_WORKER_TOKEN: ${HIKARI_WORKER_TOKEN:?Set HIKARI_WORKER_TOKEN in .env; see .env.example}
      KADAN_MODEL_DIR: /var/lib/kadan/models
    volumes:
      - model_data:/var/lib/kadan/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      hikari-api:
        condition: service_healthy

  # Video worker: H3 video with audio.
  hikari-worker-video:
    build:
      context: ./services/hikari
      dockerfile: inference_worker/workers/video/Dockerfile
    command: [/opt/kadan/bin/kadan-worker-video]
    init: true
    restart: unless-stopped
    environment:
      HIKARI_API_URL: ws://hikari-api:8000/v1/workers
      HIKARI_WORKER_TOKEN: ${HIKARI_WORKER_TOKEN:?Set HIKARI_WORKER_TOKEN in .env; see .env.example}
      KADAN_MODEL_DIR: /var/lib/kadan/models
    volumes:
      - model_data:/var/lib/kadan/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      hikari-api:
        condition: service_healthy

  hikari-frontend:
    build:
      context: ./services/hikari/frontend
    init: true
    ports:
      - "127.0.0.1:${HIKARI_FRONTEND_PORT:-8088}:8080"
    depends_on:
      hikari-api:
        condition: service_healthy
    restart: unless-stopped

  tsuchi-api:
    build:
      additional_contexts:
        tracing: ./services/tracing
      context: ./services/tsuchi
    init: true
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      KADAN_TRACE_SAMPLE_RATIO: ${KADAN_TRACE_SAMPLE_RATIO:-0.1}
      TSUCHI_DATA_DIR: /data
      TSUCHI_MAX_UPLOAD_BYTES: ${TSUCHI_MAX_UPLOAD_BYTES:-104857600}
      TSUCHI_ALLOWED_HOSTS: '["localhost","127.0.0.1","[::1]","tsuchi-api"]'
    volumes:
      - tsuchi_data:/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  tsuchi-frontend:
    build:
      context: ./services/tsuchi/web
    init: true
    ports:
      - "127.0.0.1:${TSUCHI_PORT:-8620}:8080"
    depends_on:
      tsuchi-api:
        condition: service_healthy
    restart: unless-stopped

  kadan-api:
    build:
      additional_contexts:
        tracing: ./services/tracing
      context: ./services/kadan
    # Bind only the service-network address, not the sandbox-facing interface.
    command: [uvicorn, kadan.api.server:app, --host, kadan-api-internal, --port, "8630"]
    init: true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://kadan-api-internal:8630/api/health', headers={'Host': 'localhost'}), timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      KADAN_TRACE_SAMPLE_RATIO: ${KADAN_TRACE_SAMPLE_RATIO:-0.1}
      KADAN_TSUCHI_URL: http://tsuchi-api:8000
      KADAN_HIKARI_URL: http://hikari-api:8000
      KADAN_TSUCHI_BROWSER_URL: http://127.0.0.1:${TSUCHI_PORT:-8620}
      KADAN_HIKARI_BROWSER_URL: http://127.0.0.1:${HIKARI_FRONTEND_PORT:-8088}
      KADAN_SANDBOX_URL: http://kadan-sandbox:8080
      KADAN_SANDBOX_API_KEY: ${KADAN_SANDBOX_API_KEY:?Set KADAN_SANDBOX_API_KEY in .env; see .env.example}
    depends_on:
      tsuchi-api:
        condition: service_healthy
      hikari-api:
        condition: service_healthy
    networks:
      default:
        aliases: [kadan-api-internal]
      computer:
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  # Stable logical-agent owner. Replicas need distinct KADAN_RUNNER_ID values.
  kadan-runner:
    build:
      additional_contexts:
        tracing: ./services/tracing
      context: ./services/kadan
    command: [python, -m, kadan.runner]
    init: true
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      KADAN_TRACE_SAMPLE_RATIO: ${KADAN_TRACE_SAMPLE_RATIO:-0.1}
      KADAN_TSUCHI_URL: http://tsuchi-api:8000
      KADAN_HIKARI_URL: http://hikari-api:8000
      KADAN_RUNNER_ID: ${KADAN_RUNNER_ID:-runner-1}
      KADAN_RUNNER_CAPACITY: ${KADAN_RUNNER_CAPACITY:-5}
      KADAN_SANDBOX_URL: http://kadan-sandbox:8080
      KADAN_SANDBOX_API_KEY: ${KADAN_SANDBOX_API_KEY:?Set KADAN_SANDBOX_API_KEY in .env; see .env.example}
    depends_on:
      tsuchi-api:
        condition: service_healthy
      hikari-api:
        condition: service_healthy
    networks: [default, computer]
    # This process has no HTTP server; the shared image's API probe does not apply.
    healthcheck:
      disable: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  # The computer has no direct service-network access. Kadan's control API binds
  # only on that network; Kadan can still reach the sandbox API and VNC here.
  # This does not block access through separately reachable LAN addresses.
  kadan-sandbox:
    image: ghcr.io/agent-infra/sandbox:1.11.0@sha256:6328d7fd2f0ff0b4c147c3d05b3df1ce331f4a482eb6e550ecd64ed1fcf906e7
    environment:
      SANDBOX_API_KEY: ${KADAN_SANDBOX_API_KEY:?Set KADAN_SANDBOX_API_KEY in .env; see .env.example}
      TZ: ${TZ:-UTC}
      DISPLAY_WIDTH: "1280"
      DISPLAY_HEIGHT: "800"
    # Chromium's own sandbox needs these, as in the upstream Compose file.
    security_opt: [seccomp:unconfined]
    shm_size: 2gb
    mem_limit: 4g
    cpus: 2
    volumes:
      - sandbox_home:/home/gem
    networks: [computer]
    restart: unless-stopped

  kadan-frontend:
    build:
      context: ./services/kadan/web
    init: true
    ports:
      - "127.0.0.1:${KADAN_PORT:-8630}:8080"
    depends_on:
      kadan-api:
        condition: service_healthy
    restart: unless-stopped

networks:
  computer:

volumes:
  sandbox_home:
  model_data:
  postgres_data:
  frontend_node_modules:
  tsuchi_data:
    # Reuse the standalone Tsuchi store when the owner switches to combined Compose.
    name: ${TSUCHI_DATA_VOLUME:-tsuchi_tsuchi_data}
