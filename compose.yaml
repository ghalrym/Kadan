# Preserve existing volume and container identity across checkout/repository renames.
name: kadan

services:
  postgres:
    image: postgres:18
    environment: &postgres_environment
      POSTGRES_DB: ${POSTGRES_DB:-kadan}
      POSTGRES_USER: ${POSTGRES_USER:-kadan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kadan}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment: &database_environment
      <<: *postgres_environment
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    command: ["alembic", "-c", "api/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    stop_grace_period: 5m
    build:
      context: .
      dockerfile: api/Dockerfile
    init: true
    environment:
      <<: *database_environment
      KADAN_MODEL_DIR: /var/lib/kadan/models
      KADAN_INFERENCE_WORKER: /opt/kadan/bin/kadan-inference-worker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - model_data:/var/lib/kadan/models
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    init: true
    ports:
      - "127.0.0.1:${HIKARI_FRONTEND_PORT:-8088}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  tsuchi:
    build:
      context: ./services/tsuchi
    init: true
    ports:
      - "127.0.0.1:${TSUCHI_PORT:-8620}:8000"
    environment:
      TSUCHI_DATA_DIR: /data
      TSUCHI_STATIC_DIR: /app/web/dist
      TSUCHI_MAX_UPLOAD_BYTES: ${TSUCHI_MAX_UPLOAD_BYTES:-104857600}
      TSUCHI_ALLOWED_HOSTS: '["localhost","127.0.0.1","[::1]","tsuchi"]'
    volumes:
      - tsuchi_data:/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  kadan:
    build:
      context: ./services/kadan
    init: true
    ports:
      - "127.0.0.1:${KADAN_PORT:-8630}:8630"
    environment:
      KADAN_TSUCHI_URL: http://tsuchi:8000
      KADAN_HIKARI_URL: http://api:8000
      KADAN_TSUCHI_BROWSER_URL: http://127.0.0.1:${TSUCHI_PORT:-8620}
      KADAN_HIKARI_BROWSER_URL: http://127.0.0.1:${HIKARI_FRONTEND_PORT:-8088}
      KADAN_FRONTEND_DIRECTORY: /app/web/dist
    depends_on:
      tsuchi:
        condition: service_healthy
      api:
        condition: service_healthy
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  model_data:
  postgres_data:
  frontend_node_modules:
  tsuchi_data:
    # Reuse the standalone Tsuchi store when the owner switches to combined Compose.
    name: ${TSUCHI_DATA_VOLUME:-tsuchi_tsuchi_data}
