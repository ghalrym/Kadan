services:
  frontend:
    image: node:24-bookworm-slim
    working_dir: /app
    init: true
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      WATCH_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command:
      - sh
      - -c
      - npm ci && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort

volumes:
  frontend_node_modules:
