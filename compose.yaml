services:
  postgres:
    image: postgres:18
    environment: &postgres_environment
      POSTGRES_DB: ${POSTGRES_DB:-kadan}
      POSTGRES_USER: ${POSTGRES_USER:-kadan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kadan}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ./api
    environment: &database_environment
      <<: *postgres_environment
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    command: ["alembic", "-c", "api/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./api
    init: true
    environment:
      <<: *database_environment
      KADAN_MODEL_DIR: /var/lib/kadan/models
      KADAN_GPU: ${KADAN_GPU:-0}
      HF_HOME: /var/lib/kadan/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - model_data:/var/lib/kadan/models
      - hf_data:/var/lib/kadan/huggingface
    stop_grace_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    image: node:24-bookworm-slim
    working_dir: /app
    init: true
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      WATCH_POLLING: "true"
      API_PROXY_TARGET: "http://api:8000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command:
      - sh
      - -c
      - npm ci && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort

volumes:
  model_data:
  postgres_data:
  frontend_node_modules:
  hf_data:
