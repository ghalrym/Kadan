# Preserve existing volume and container identity across checkout/repository renames.
name: kadan

x-lfm3-worker: &lfm3_worker
  build:
    context: ./services/hikari
    dockerfile: experimental_worker/Dockerfile
  init: true
  restart: unless-stopped
  environment: &lfm3_environment
    HIKARI_API_URL: ${HIKARI_API_URL:-ws://api:8000/hikari/v1/workers}
    HIKARI_WORKER_TOKEN: ${HIKARI_WORKER_TOKEN:-insecure-api-key}
    KADAN_MODEL_DIR: /var/lib/kadan/models
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  depends_on:
    api:
      condition: service_healthy

services:
  jaeger:
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    profiles: [tracing]
    command: [--config, /etc/jaeger/config.yaml]
    volumes:
      - ./infrastructure/jaeger/config.yaml:/etc/jaeger/config.yaml
    # OTLP stays on the existing Compose network; only the UI is published.
    ports:
      - "0.0.0.0:16686:16686"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    environment:
      GOMEMLIMIT: 400MiB
      GOMAXPROCS: "1"
    restart: unless-stopped

  hikari-postgres:
    image: postgres:18
    environment: &postgres_environment
      POSTGRES_DB: ${POSTGRES_DB:-kadan}
      POSTGRES_USER: ${POSTGRES_USER:-kadan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kadan}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  hikari-migrate:
    build: &api_build
      context: ./services/api
      additional_contexts:
        tracing: ./services/tracing
        hikari: ./services/hikari
        tsuchi: ./services/tsuchi
        kadan: ./services/kadan
    environment: &database_environment
      <<: *postgres_environment
      POSTGRES_HOST: hikari-postgres
      POSTGRES_PORT: "5432"
    command: ["alembic", "-c", "api/alembic.ini", "upgrade", "head"]
    depends_on:
      hikari-postgres:
        condition: service_healthy
    restart: "no"

  # One application serving Kadan, Hikari and Tsuchi under /kadan, /hikari and
  # /tsuchi. It coordinates every Hikari worker's memory; it runs no inference.
  api:
    stop_grace_period: 5m
    build: *api_build
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      KADAN_TRACE_SAMPLE_RATIO: ${KADAN_TRACE_SAMPLE_RATIO:-0.1}
      <<: *database_environment
      # Every worker container authenticates with this token.
      HIKARI_WORKER_TOKEN: ${HIKARI_WORKER_TOKEN:-insecure-api-key}
      HIKARI_MODEL_IDLE_SECONDS: ${HIKARI_MODEL_IDLE_SECONDS:-3600}
      HIKARI_KV_CACHE_IDLE_SECONDS: ${HIKARI_KV_CACHE_IDLE_SECONDS:-3600}
      TSUCHI_DATA_DIR: /data
      TSUCHI_MAX_UPLOAD_BYTES: ${TSUCHI_MAX_UPLOAD_BYTES:-104857600}
      # Kadan reaches Tsuchi and Hikari through this same application.
      KADAN_TSUCHI_URL: http://127.0.0.1:8000/tsuchi
      KADAN_HIKARI_URL: http://127.0.0.1:8000/hikari
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      hikari-postgres:
        condition: service_healthy
      hikari-migrate:
        condition: service_completed_successfully
    ports:
      - "0.0.0.0:${API_PORT:-8000}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request as u; [u.urlopen(f'http://127.0.0.1:8000{p}', timeout=2) for p in ('/hikari/health', '/tsuchi/api/health', '/kadan/api/health')]"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - tsuchi_data:/data
      - ./services/api/combined:/app/combined
      - ./services/hikari/api:/app/api
      - ./services/hikari/bin:/app/bin
      - ./services/tsuchi/tsuchi:/app/tsuchi
      - ./services/kadan/kadan:/app/kadan

  # Calls use the same pinned audio checkpoint and volume as the former overlay.
  hikari-worker-lfm3-audio:
    <<: *lfm3_worker
    environment:
      <<: *lfm3_environment
      HIKARI_EXPERIMENTAL_BACKEND: experimental_worker.audio
    volumes:
      - lfm3_audio_model_data:/var/lib/kadan/models

  # Language & vision worker: Inkling 2 Mini on Strata.
  hikari-worker-llm:
    build:
      context: ./services/hikari
      dockerfile: inference_worker/workers/llm/Dockerfile
    command: [python, bin/hikari.py, run, worker, llm]
    init: true
    restart: unless-stopped
    environment:
      HIKARI_API_URL: ${HIKARI_API_URL:-ws://api:8000/hikari/v1/workers}
      HIKARI_WORKER_TOKEN: ${HIKARI_WORKER_TOKEN:-insecure-api-key}
      KADAN_MODEL_DIR: /var/lib/kadan/models
      HIKARI_LLM_QUANT: ${HIKARI_LLM_QUANT:-IQ4_NL}
      HIKARI_LLM_CONTEXT_LIMIT: ${HIKARI_LLM_CONTEXT_LIMIT:-65536}
    volumes:
      - model_data:/var/lib/kadan/models
      - ./services/hikari/bin:/app/bin
      - ./services/hikari/inference_worker:/src/inference_worker
      # Seeded from this image's build tree on first use; keeps rebuilds incremental.
      - hikari_worker_llm_build:/build
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      api:
        condition: service_healthy

  # Decisions worker: d1 on the CPU.
  hikari-worker-decision:
    build:
      context: ./services/hikari
      dockerfile: experimental_worker/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      <<: *lfm3_environment
      HIKARI_EXPERIMENTAL_BACKEND: d1
      NVIDIA_VISIBLE_DEVICES: void
      CUDA_VISIBLE_DEVICES: ""
    volumes:
      - model_data:/var/lib/kadan/models
      - ./services/hikari/experimental_worker:/app/experimental_worker:ro
    # CPU only; the GPU worker anchor must not supply a device reservation.
    cpus: 2
    mem_limit: 16g
    memswap_limit: 16g
    depends_on:
      api:
        condition: service_healthy

  # Speech synthesis worker.
  hikari-worker-tts:
    build:
      context: ./services/hikari
      dockerfile: inference_worker/workers/tts/Dockerfile
    command: [python, bin/hikari.py, run, worker, tts]
    init: true
    restart: unless-stopped
    environment:
      HIKARI_API_URL: ${HIKARI_API_URL:-ws://api:8000/hikari/v1/workers}
      HIKARI_WORKER_TOKEN: ${HIKARI_WORKER_TOKEN:-insecure-api-key}
      KADAN_MODEL_DIR: /var/lib/kadan/models
    volumes:
      - model_data:/var/lib/kadan/models
      - ./services/hikari/bin:/app/bin
      - ./services/hikari/inference_worker:/src/inference_worker
      # Seeded from this image's build tree on first use; keeps rebuilds incremental.
      - hikari_worker_tts_build:/build
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      api:
        condition: service_healthy

  # Transcription worker: native Whisper.
  hikari-worker-speech:
    build:
      context: ./services/hikari
      dockerfile: inference_worker/workers/speech/Dockerfile
    command: [python, bin/hikari.py, run, worker, speech]
    init: true
    restart: unless-stopped
    environment:
      HIKARI_API_URL: ${HIKARI_API_URL:-ws://api:8000/hikari/v1/workers}
      HIKARI_WORKER_TOKEN: ${HIKARI_WORKER_TOKEN:-insecure-api-key}
      KADAN_MODEL_DIR: /var/lib/kadan/models
    volumes:
      - model_data:/var/lib/kadan/models
      - ./services/hikari/bin:/app/bin
      - ./services/hikari/inference_worker:/src/inference_worker
      # Seeded from this image's build tree on first use; keeps rebuilds incremental.
      - hikari_worker_speech_build:/build
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      api:
        condition: service_healthy

  # Transcript formatting worker: S1-mini on the CPU.
  hikari-worker-formatting:
    build:
      context: ./services/hikari
      dockerfile: inference_worker/workers/formatting/Dockerfile
    command: [python, bin/hikari.py, run, worker, formatting]
    init: true
    restart: unless-stopped
    environment:
      HIKARI_API_URL: ${HIKARI_API_URL:-ws://api:8000/hikari/v1/workers}
      HIKARI_WORKER_TOKEN: ${HIKARI_WORKER_TOKEN:-insecure-api-key}
      KADAN_MODEL_DIR: /var/lib/kadan/models
    volumes:
      - model_data:/var/lib/kadan/models
      - ./services/hikari/bin:/app/bin
      - ./services/hikari/inference_worker:/src/inference_worker
      # Seeded from this image's build tree on first use; keeps rebuilds incremental.
      - hikari_worker_formatting_build:/build
    # CPU only: no GPU reservation.
    depends_on:
      api:
        condition: service_healthy

  # Image worker: Qwen Image.
  hikari-worker-image:
    build:
      context: ./services/hikari
      dockerfile: inference_worker/workers/image/Dockerfile
    command: [python, bin/hikari.py, run, worker, image]
    init: true
    restart: unless-stopped
    environment:
      HIKARI_API_URL: ${HIKARI_API_URL:-ws://api:8000/hikari/v1/workers}
      HIKARI_WORKER_TOKEN: ${HIKARI_WORKER_TOKEN:-insecure-api-key}
      KADAN_MODEL_DIR: /var/lib/kadan/models
    volumes:
      - model_data:/var/lib/kadan/models
      - ./services/hikari/bin:/app/bin
      - ./services/hikari/inference_worker:/src/inference_worker
      # Seeded from this image's build tree on first use; keeps rebuilds incremental.
      - hikari_worker_image_build:/build
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      api:
        condition: service_healthy

  # Video worker: H3 video with audio.
  hikari-worker-video:
    build:
      context: ./services/hikari
      dockerfile: inference_worker/workers/video/Dockerfile
    command: [python, bin/hikari.py, run, worker, video]
    init: true
    restart: unless-stopped
    environment:
      HIKARI_API_URL: ${HIKARI_API_URL:-ws://api:8000/hikari/v1/workers}
      HIKARI_WORKER_TOKEN: ${HIKARI_WORKER_TOKEN:-insecure-api-key}
      KADAN_MODEL_DIR: /var/lib/kadan/models
    volumes:
      - model_data:/var/lib/kadan/models
      - ./services/hikari/bin:/app/bin
      - ./services/hikari/inference_worker:/src/inference_worker
      # Seeded from this image's build tree on first use; keeps rebuilds incremental.
      - hikari_worker_video_build:/build
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      api:
        condition: service_healthy

  # Stable logical-agent owner. Replicas need distinct KADAN_RUNNER_ID values.
  kadan-runner: &kadan_runner
    build:
      additional_contexts:
        tracing: ./services/tracing
      context: ./services/kadan
    command:
      - watchfiles
      - --filter
      - python
      - kadan.runner.__main__.run
      - /app/kadan
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: &runner_environment
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      KADAN_TRACE_SAMPLE_RATIO: ${KADAN_TRACE_SAMPLE_RATIO:-0.1}
      KADAN_TSUCHI_URL: http://api:8000/tsuchi
      KADAN_HIKARI_URL: http://api:8000/hikari
      KADAN_RUNNER_ID: ${KADAN_RUNNER_ID:-runner-1}
      KADAN_RUNNER_CAPACITY: ${KADAN_RUNNER_CAPACITY:-5}
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      api:
        condition: service_healthy
    # This process has no HTTP server; the shared image's API probe does not apply.
    healthcheck:
      disable: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped
    volumes:
      - ./services/kadan/kadan:/app/kadan

  # One web app: Kadan at /, Tsuchi at /tsuchi and Hikari at /hikari.
  frontend:
    build:
      context: ./services/frontend
    init: true
    ports:
      - "0.0.0.0:${KADAN_PORT:-8630}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      WATCH_POLLING: "true"
      API_URL: http://api:8000
    volumes:
      - ./services/frontend:/app
      - frontend_node_modules:/app/node_modules
    command: [sh, -c, "npm ci --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 8080 --strictPort"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Explicit owners need unique, stable IDs; never scale a shared runner ID.
  kadan-runner-2:
    <<: *kadan_runner
    profiles: [runners]
    environment:
      <<: *runner_environment
      KADAN_RUNNER_ID: runner-2

volumes:
  lfm3_audio_model_data:
  model_data:
    name: ${HIKARI_MODEL_VOLUME:-${COMPOSE_PROJECT_NAME}_model_data}
  postgres_data:
  frontend_node_modules:
  tsuchi_data:
    # Reuse the standalone Tsuchi store when the owner switches to combined Compose.
    name: ${TSUCHI_DATA_VOLUME:-tsuchi_tsuchi_data}
  hikari_worker_llm_build:
  # Retain the old native Decisions build volume; no existing data is removed.
  hikari_worker_decision_build:
  hikari_worker_tts_build:
  hikari_worker_speech_build:
  hikari_worker_formatting_build:
  hikari_worker_image_build:
  hikari_worker_video_build:
