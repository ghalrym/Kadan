# Keep upstream keep-alive for HTTP while passing WebSocket upgrades (VNC).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API enforces its own body limit. Keep chat streams unbuffered.
    client_max_body_size 0;

    location = /frontend-health {
        access_log off;
        return 200 'ok';
    }

    location ~ ^/(api(?:/|$)|openapi\.json$|docs(?:/|$)) {
        # Resolve the current container address after an API replacement.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kadan_api http://kadan-api:8630;
        proxy_pass $kadan_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
