[program:kadan-panel]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/tint2 -c /opt/kadan/desktop/tint2rc
autostart=%(ENV_AUTOSTART_VNC)s
autorestart=true
priority=910
user=%(ENV_USER)s
stdout_logfile=%(ENV_LOG_DIR)s/kadan-panel.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true
