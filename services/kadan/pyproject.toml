[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kadan"
version = "0.1.0"
description = "Local conversation coordinator for Tsuchi and Hikari"
requires-python = ">=3.12"
dependencies = [
  "kadan-tracing==0.1.0",
  "fastapi>=0.143,<1",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "uvicorn>=0.54,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.32,<1",
  "Pillow>=11,<14",
  "langgraph>=1.2.16,<2",
  "langchain-core>=1.6.12,<2",
  "websockets>=15.0.1,<16",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
include = ["kadan*"]

[tool.pytest.ini_options]
testpaths = ["kadan/api/tests"]
addopts = "-q"
